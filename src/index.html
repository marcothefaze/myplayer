<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a10">
  <title>SSG Universe</title>
  <!-- Icona dell'app: favicon (PC/tab) + icona home screen (iPhone/Android) -->
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/icon-180.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="style.css?v=14">
  <!-- Il ?v=N forza il browser a scaricare di nuovo i file a ogni rilascio,
       evitando che resti in cache una versione vecchia dell'app. -->
</head>
<body>

  <!-- Unico elemento audio: tutta la riproduzione passa di qui -->
  <audio id="audio" preload="metadata"></audio>

  <!-- ============ BARRA SUPERIORE ============ -->
  <header class="topbar">
    <button id="btn-back" class="back-btn hidden" title="Torna alla home" aria-label="Torna alla home">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
        <path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/>
      </svg>
    </button>
    <div class="brand">
      <img class="brand-mark" src="../assets/icons/icon-180.png" alt="SSG Universe">
      <div class="brand-text">
        <div class="brand-name">SSG Universe</div>
        <div id="brand-count" class="brand-sub">Caricamento...</div>
      </div>
    </div>
  </header>

  <!-- ============ CONTENUTI ============ -->
  <main id="main" class="main">

    <!-- Vista 1: HOME -> griglia di copertine degli album -->
    <section id="view-home" class="view">
      <div id="album-grid" class="album-grid"></div>
    </section>

    <!-- Vista 2: ALBUM -> copertina grande + lista brani -->
    <section id="view-album" class="view hidden">
      <div id="album-hero" class="album-hero">
        <div id="hero-bg" class="hero-bg"></div>
        <div id="album-cover-wrap" class="album-cover-wrap"></div>
        <div class="album-head">
          <span class="eyebrow">Album</span>
          <h1 id="album-title" class="album-title"></h1>
          <p id="album-meta" class="album-meta"></p>
        </div>
      </div>
      <div id="track-list" class="track-list"></div>
    </section>

  </main>

  <!-- ============ PLAYER FISSO IN BASSO ============ -->
  <footer id="player" class="player-bar">

    <!-- Barra di avanzamento: in alto, sopra i controlli -->
    <div class="progress-area player-progress">
      <span id="time-current" class="time">0:00</span>
      <div id="seek" class="seek">
        <div id="seek-fill" class="seek-fill"></div>
      </div>
      <span id="time-duration" class="time">0:00</span>
    </div>

    <div class="player-row">

    <!-- Info brano in riproduzione (clic = apre il full player) -->
    <div id="track-info" class="track-info" title="Apri a schermo intero">
      <div id="cover" class="cover">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="track-meta">
        <div id="song-title" class="track-title">SSG Universe</div>
        <div id="song-artist" class="track-artist">Scegli un album per iniziare</div>
      </div>
    </div>

    <!-- Controlli: shuffle, precedente, play, successiva, repeat -->
    <div class="controls">
      <button id="btn-shuffle" class="ctrl-btn" title="Riproduzione casuale" aria-label="Riproduzione casuale">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
        </svg>
      </button>

      <button id="btn-prev" class="ctrl-btn" title="Precedente" aria-label="Precedente">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>

      <button id="btn-play" class="ctrl-btn btn-play" title="Play/Pausa" aria-label="Play o pausa">
        <svg id="icon-play" class="ctrl-icon" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="icon-pause" class="ctrl-icon" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true" style="display:none">
          <rect x="6" y="5" width="4" height="14" rx="1"/>
          <rect x="14" y="5" width="4" height="14" rx="1"/>
        </svg>
      </button>

      <button id="btn-next" class="ctrl-btn" title="Successiva" aria-label="Successiva">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/>
        </svg>
      </button>

      <button id="btn-repeat" class="ctrl-btn" title="Ripeti" aria-label="Ripeti">
        <span id="rep-badge" class="rep-badge hidden">1</span>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
        </svg>
      </button>
    </div>

    <!-- Volume -->
    <div class="right-side">
      <div class="volume-area">
        <svg id="volume-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="volume-icon" aria-hidden="true">
          <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.06a7 7 0 0 1 0 13.48v2.06a9 9 0 0 0 0-17.6z"/>
        </svg>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      </div>
    </div>
    </div><!-- /player-row -->

  </footer>

  <!-- ============ FULL PLAYER a tendina (stile Spotify) ============
       Si apre cliccando sulla copertina/brano nella barra in basso.
       Si chiude: chevron in alto, tasto Esc, o trascinando giù. -->
  <div id="full-player" class="full-player" aria-hidden="true">
    <div id="fp-bg" class="fp-bg"></div>

    <div class="fp-inner">
      <!-- Zona alta: pillina apribile/tracciabile + pulsante di chiusura -->
      <div id="fp-handle" class="fp-handle">
        <button id="fp-collapse" class="fp-collapse" title="Riduci il player" aria-label="Riduci il player">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/>
          </svg>
        </button>
      </div>

      <div id="fp-cover" class="fp-cover"></div>

      <div class="fp-meta">
        <div id="fp-title" class="fp-title">SSG Universe</div>
        <div id="fp-album" class="fp-album">Scegli un brano per iniziare</div>
      </div>

      <div class="fp-progress">
        <span id="fp-time-current" class="time">0:00</span>
        <div id="fp-seek" class="seek fp-seek">
          <div id="fp-seek-fill" class="seek-fill"></div>
        </div>
        <span id="fp-time-duration" class="time">0:00</span>
      </div>

      <div class="fp-controls">
        <button id="fp-shuffle" class="ctrl-btn fp-btn" title="Riproduzione casuale" aria-label="Riproduzione casuale">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
          </svg>
        </button>

        <button id="fp-prev" class="ctrl-btn fp-btn" title="Precedente" aria-label="Precedente">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
          </svg>
        </button>

        <button id="fp-play" class="ctrl-btn fp-play" title="Play/Pausa" aria-label="Play o pausa">
          <svg id="fp-icon-play" class="ctrl-icon" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="fp-icon-pause" class="ctrl-icon" viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true" style="display:none">
            <rect x="6" y="5" width="4" height="14" rx="1"/>
            <rect x="14" y="5" width="4" height="14" rx="1"/>
          </svg>
        </button>

        <button id="fp-next" class="ctrl-btn fp-btn" title="Successiva" aria-label="Successiva">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
            <path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/>
          </svg>
        </button>

        <button id="fp-repeat" class="ctrl-btn fp-btn" title="Ripeti" aria-label="Ripeti">
          <span id="fp-rep-badge" class="rep-badge hidden">1</span>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
        </button>
      </div>

      <div class="fp-volume">
        <svg id="fp-volume-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" class="volume-icon" aria-hidden="true">
          <path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.06a7 7 0 0 1 0 13.48v2.06a9 9 0 0 0 0-17.6z"/>
        </svg>
        <input id="fp-volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      </div>
    </div>
  </div>

  <script src="player.js?v=14"></script>
</body>
</html>
